<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DB Engine Benchmark: B-tree vs LSM-tree</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', system-ui, sans-serif; background: #0b1120; color: #e2e8f0; min-height: 100vh; }

    /* ── Header ── */
    header { background: linear-gradient(135deg, #0f2a4a 0%, #1a1f5e 100%); padding: 1.5rem 2rem; border-bottom: 1px solid #1e2d4a; }
    header h1 { font-size: 1.6rem; font-weight: 800; color: #f0f6ff; letter-spacing: -0.02em; }
    header p  { margin-top: 0.35rem; color: #7aa3cc; font-size: 0.85rem; }
    .engine-badges { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-top: 0.75rem; }
    .badge { display: inline-flex; align-items: center; gap: 0.3rem; padding: 0.2rem 0.6rem; border-radius: 9999px; font-size: 0.7rem; font-weight: 600; border: 1px solid; }

    /* ── Layout ── */
    main { max-width: 1400px; margin: 0 auto; padding: 1.5rem 1rem; }

    /* ── Controls ── */
    .controls { background: #111827; border: 1px solid #1e2d4a; border-radius: 0.75rem; padding: 1.25rem 1.5rem; margin-bottom: 1.5rem; }
    .controls h2 { font-size: 0.75rem; font-weight: 700; color: #64748b; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 1rem; }
    .ctrl-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 0.75rem; align-items: end; }
    .ctrl-field label { display: block; font-size: 0.75rem; color: #94a3b8; margin-bottom: 0.3rem; }
    input[type=number], select {
      width: 100%; background: #0b1120; border: 1px solid #2d3f5a; border-radius: 0.375rem;
      color: #f1f5f9; padding: 0.45rem 0.7rem; font-size: 0.85rem;
    }
    .engine-checkboxes { display: flex; flex-wrap: wrap; gap: 0.5rem; }
    .engine-checkbox { display: flex; align-items: center; gap: 0.3rem; cursor: pointer; font-size: 0.78rem; padding: 0.25rem 0.6rem; border-radius: 0.35rem; border: 1px solid #2d3f5a; transition: background 0.15s; user-select: none; }
    .engine-checkbox:hover { background: #1a2540; }
    .engine-checkbox input { display: none; }
    .engine-checkbox.checked { border-color: var(--eng-color); background: color-mix(in srgb, var(--eng-color) 15%, transparent); }
    .ctrl-actions { display: flex; flex-wrap: wrap; gap: 0.6rem; margin-top: 1rem; }
    button { padding: 0.5rem 1.1rem; border-radius: 0.45rem; border: none; font-weight: 600; font-size: 0.82rem; cursor: pointer; transition: opacity 0.15s; }
    button:hover { opacity: 0.85; }
    button:disabled { opacity: 0.35; cursor: not-allowed; }
    .btn-run    { background: #2563eb; color: #fff; }
    .btn-csv    { background: #059669; color: #fff; }
    .btn-clear  { background: #374151; color: #d1d5db; }

    /* ── Status bar ── */
    #status-bar { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 1.5rem; }
    .status-pill { padding: 0.3rem 0.8rem; border-radius: 9999px; font-size: 0.78rem; font-weight: 600; }
    .status-idle    { background: #1e2d4a; color: #94a3b8; }
    .status-running { background: #1d3a24; color: #4ade80; }
    .status-done    { background: #1c2d3d; color: #38bdf8; }

    /* ── Metric tabs ── */
    .metric-tabs { display: flex; gap: 0.4rem; margin-bottom: 1rem; flex-wrap: wrap; }
    .metric-tab { padding: 0.35rem 0.85rem; border-radius: 0.4rem; font-size: 0.78rem; font-weight: 600; cursor: pointer; border: 1px solid #2d3f5a; color: #94a3b8; background: transparent; transition: all 0.15s; }
    .metric-tab.active { background: #1e3a5f; border-color: #2563eb; color: #93c5fd; }

    /* ── Chart ── */
    .chart-card { background: #111827; border: 1px solid #1e2d4a; border-radius: 0.75rem; padding: 1.25rem; margin-bottom: 1.5rem; }
    .chart-card h3 { font-size: 0.8rem; color: #64748b; text-transform: uppercase; letter-spacing: 0.07em; margin-bottom: 1rem; }
    .chart-wrap { position: relative; height: 300px; }

    /* ── Results table ── */
    .table-card { background: #111827; border: 1px solid #1e2d4a; border-radius: 0.75rem; overflow: hidden; margin-bottom: 1.5rem; }
    .table-card h3 { font-size: 0.8rem; color: #64748b; text-transform: uppercase; letter-spacing: 0.07em; padding: 1rem 1.25rem 0.75rem; border-bottom: 1px solid #1e2d4a; }
    .tbl-scroll { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 0.8rem; min-width: 900px; }
    thead tr { background: #0b1120; }
    th { padding: 0.6rem 0.75rem; text-align: right; font-size: 0.7rem; font-weight: 700; color: #4b5d73; text-transform: uppercase; letter-spacing: 0.05em; white-space: nowrap; }
    th:first-child, th:nth-child(2) { text-align: left; }
    td { padding: 0.55rem 0.75rem; text-align: right; border-top: 1px solid #1a2540; white-space: nowrap; }
    td:first-child, td:nth-child(2) { text-align: left; }
    tr:hover td { background: #13202f; }
    .engine-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 0.4rem; }
    .val-good   { color: #4ade80; }
    .val-na     { color: #374151; }
    .status-unavailable { color: #6b7280; font-style: italic; }
    .status-error       { color: #f87171; }

    /* ── Overlay ── */
    #overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.75); z-index: 50; flex-direction: column; align-items: center; justify-content: center; gap: 1rem; }
    #overlay.active { display: flex; }
    .spinner { width: 44px; height: 44px; border: 4px solid #1e2d4a; border-top-color: #2563eb; border-radius: 50%; animation: spin 0.7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    #overlay p { color: #94a3b8; font-size: 0.9rem; }
    .progress-engines { display: flex; flex-wrap: wrap; gap: 0.4rem; justify-content: center; max-width: 400px; }

    /* ── Error box ── */
    .error-box { background: #2d0b0b; border: 1px solid #7f1d1d; border-radius: 0.5rem; padding: 0.75rem 1rem; color: #fca5a5; font-size: 0.82rem; margin-top: 0.75rem; }

    /* ── Legend ── */
    .legend-section { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 0.75rem; margin-bottom: 1.5rem; }
    .legend-card { background: #111827; border: 1px solid #1e2d4a; border-radius: 0.65rem; padding: 0.9rem 1rem; }
    .legend-card h4 { font-size: 0.8rem; font-weight: 700; margin-bottom: 0.4rem; }
    .legend-card .tag { display: inline-block; font-size: 0.65rem; font-weight: 600; padding: 0.1rem 0.45rem; border-radius: 9999px; margin-bottom: 0.35rem; }
    .legend-card p { font-size: 0.73rem; color: #64748b; line-height: 1.5; }
    .tag-btree { background: #1e3a5f; color: #93c5fd; }
    .tag-lsm   { background: #14352a; color: #6ee7b7; }
  </style>
</head>
<body>

<div id="overlay">
  <div class="spinner"></div>
  <p id="overlay-msg">ベンチマーク実行中...</p>
  <div class="progress-engines" id="overlay-engines"></div>
</div>

<header>
  <h1>DB Engine Benchmark</h1>
  <p>B-tree vs LSM-tree — 7 エンジン × 7 ワークロード × 5 指標の性能比較</p>
  <div class="engine-badges" id="header-badges"></div>
</header>

<main>

  <!-- DB engine legend -->
  <div class="legend-section" id="legend-section"></div>

  <!-- Controls -->
  <div class="controls">
    <h2>設定 &amp; 実行</h2>
    <div class="ctrl-grid">
      <div class="ctrl-field">
        <label>INSERT / DELETE 件数</label>
        <input type="number" id="rowCount" value="5000" min="100" max="200000" step="500">
      </div>
      <div class="ctrl-field">
        <label>Read / Mixed 回数</label>
        <input type="number" id="readIter" value="1000" min="100" max="20000" step="100">
      </div>
      <div class="ctrl-field" style="grid-column: span 2;">
        <label>対象 DBエンジン</label>
        <div class="engine-checkboxes" id="engine-checkboxes"></div>
      </div>
    </div>
    <div class="ctrl-actions">
      <button class="btn-run"   id="btn-run"   onclick="runBenchmark()">▶ ベンチマーク実行</button>
      <button class="btn-csv"   id="btn-csv"   onclick="downloadCsv()" disabled>CSV ダウンロード</button>
      <button class="btn-clear" id="btn-clear" onclick="clearResults()">クリア</button>
    </div>
    <div id="error-area"></div>
  </div>

  <!-- Status -->
  <div id="status-bar">
    <span class="status-pill status-idle" id="status-pill">待機中</span>
    <span id="status-text" style="font-size:0.8rem;color:#4b5d73;"></span>
  </div>

  <!-- Metric tabs + chart -->
  <div id="results-section" style="display:none;">
    <div class="metric-tabs" id="metric-tabs"></div>

    <div class="chart-card">
      <h3 id="chart-title">スループット (ops/s) — ワークロード別比較</h3>
      <div class="chart-wrap"><canvas id="mainChart"></canvas></div>
    </div>

    <div class="table-card">
      <h3>詳細結果</h3>
      <div class="tbl-scroll">
        <table>
          <thead>
            <tr>
              <th>ワークロード</th>
              <th>DB エンジン</th>
              <th>Throughput<br>(ops/s)</th>
              <th>Avg Latency<br>(ms)</th>
              <th>P95<br>(ms)</th>
              <th>P99<br>(ms)</th>
              <th>CPU<br>(%)</th>
              <th>WAF</th>
              <th>Storage<br>(MB)</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody id="result-tbody"></tbody>
        </table>
      </div>
    </div>
  </div>

</main>

<script>
// ── Constants ───────────────────────────────────────────────────────────────
const WORKLOAD_ORDER = [
  'INSERT_ONLY','UPDATE_HEAVY','POINT_READ','RANGE_READ',
  'DELETE_HEAVY','MIXED','STORAGE_SIZE'
];
const WORKLOAD_LABEL = {
  INSERT_ONLY:  'Insert Only',
  UPDATE_HEAVY: 'Update Heavy',
  POINT_READ:   'Point Read',
  RANGE_READ:   'Range Read',
  DELETE_HEAVY: 'Delete Heavy',
  MIXED:        'Mixed (70R/30W)',
  STORAGE_SIZE: 'Storage Size'
};
const METRICS = [
  { key: 'throughputOpsPerSec', label: 'Throughput (ops/s)',  unit: 'ops/s',  title: 'スループット (ops/s) — 高いほど速い'   },
  { key: 'avgLatencyMs',        label: 'Avg Latency (ms)',    unit: 'ms',     title: '平均レイテンシ (ms) — 低いほど速い'    },
  { key: 'p95LatencyMs',        label: 'P95 Latency (ms)',    unit: 'ms',     title: 'P95 レイテンシ (ms) — 低いほど速い'   },
  { key: 'p99LatencyMs',        label: 'P99 Latency (ms)',    unit: 'ms',     title: 'P99 レイテンシ (ms) — 低いほど速い'   },
  { key: 'cpuUsagePercent',     label: 'CPU (%)',             unit: '%',      title: 'CPU使用率 (%) — 低いほど効率的'        },
  { key: 'writeAmplificationFactor', label: 'WAF',            unit: 'x',      title: '書き込み増幅率 (WAF) — 低いほど良い'  },
  { key: 'storageSizeBytes',    label: 'Storage (MB)',        unit: 'MB',     title: 'ストレージ使用量 (MB)'                 }
];

// ── State ────────────────────────────────────────────────────────────────────
let allResults = [];
let engines    = [];
let chart      = null;
let activeMetric = 'throughputOpsPerSec';

// ── Boot ─────────────────────────────────────────────────────────────────────
async function boot() {
  try {
    const r = await fetch('/api/benchmark/engines');
    engines = r.ok ? await r.json() : [];
  } catch (e) {
    engines = [];
  }
  buildEngineBadges();
  buildLegend();
  buildEngineCheckboxes();
  buildMetricTabs();
}

function buildEngineBadges() {
  const wrap = document.getElementById('header-badges');
  engines.forEach(e => {
    const span = document.createElement('span');
    span.className = 'badge';
    span.style.cssText = `background:${hexAlpha(e.color,0.15)};color:${e.color};border-color:${hexAlpha(e.color,0.4)}`;
    span.textContent = e.displayName + ' (' + e.indexType + ')';
    wrap.appendChild(span);
  });
  if (!engines.length) {
    wrap.innerHTML = '<span style="color:#4b5d73;font-size:0.78rem;">DBに接続できません — docker-compose up を確認してください</span>';
  }
}

function buildLegend() {
  const descriptions = {
    POSTGRESQL:   'ページベースのB+ツリー。クラスタードインデックスで点検索・範囲スキャンが得意。MVCC で並行制御。',
    MYSQL_INNODB: 'クラスタードB+ツリー。バッファプールで頻繁アクセスページをキャッシュ。読み込み性能に優れる。',
    MYSQL_MYROCKS:'MySQL上で動作するRocksDB (LSM-tree)。シーケンシャル書き込みに強くスペース効率が高い。',
    CASSANDRA:    '分散LSM-tree。SSTables + Compaction。大量書き込みに強いが点検索で読み増幅あり。',
    SCYLLADB:     'C++で再実装されたCassandra互換。CPU効率が高く低レイテンシ。LSM-tree構造。',
    ROCKSDB:      'MetaのKey-Value LSM-treeエンジン（組み込み）。書き込み重視。WAFを直接計測可能。',
    COCKROACHDB:  '分散B-tree (Paxos)。PostgreSQL互換。水平スケール向けだが単ノードではオーバーヘッドあり。'
  };
  const section = document.getElementById('legend-section');
  engines.forEach(e => {
    const div = document.createElement('div');
    div.className = 'legend-card';
    div.style.borderColor = hexAlpha(e.color, 0.4);
    div.innerHTML = `
      <h4 style="color:${e.color}">${e.displayName}</h4>
      <span class="tag ${e.indexType === 'B-tree' ? 'tag-btree' : 'tag-lsm'}">${e.indexType}</span>
      <p>${descriptions[e.id] || ''}</p>`;
    section.appendChild(div);
  });
}

function buildEngineCheckboxes() {
  const wrap = document.getElementById('engine-checkboxes');
  engines.forEach(e => {
    const label = document.createElement('label');
    label.className = 'engine-checkbox checked';
    label.style.setProperty('--eng-color', e.color);
    label.dataset.engine = e.id;
    label.innerHTML = `<input type="checkbox" value="${e.id}" checked>
      <span class="engine-dot" style="background:${e.color}"></span>${e.displayName}`;
    label.querySelector('input').addEventListener('change', () => {
      label.classList.toggle('checked', label.querySelector('input').checked);
    });
    label.addEventListener('click', ev => {
      if (ev.target.tagName !== 'INPUT') {
        const cb = label.querySelector('input');
        cb.checked = !cb.checked;
        cb.dispatchEvent(new Event('change'));
      }
    });
    wrap.appendChild(label);
  });
}

function buildMetricTabs() {
  const wrap = document.getElementById('metric-tabs');
  METRICS.forEach((m, i) => {
    const btn = document.createElement('button');
    btn.className = 'metric-tab' + (m.key === activeMetric ? ' active' : '');
    btn.textContent = m.label;
    btn.onclick = () => {
      activeMetric = m.key;
      document.querySelectorAll('.metric-tab').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderChart();
    };
    wrap.appendChild(btn);
  });
}

// ── Run benchmark ─────────────────────────────────────────────────────────────
async function runBenchmark() {
  const rowCount = document.getElementById('rowCount').value;
  const readIter = document.getElementById('readIter').value;
  const selected = [...document.querySelectorAll('.engine-checkbox input:checked')].map(i => i.value);

  if (!selected.length) { showError('最低1つのDBエンジンを選択してください'); return; }

  clearError();
  setRunning(true);

  const params = new URLSearchParams({ rowCount, readIter });
  selected.forEach(e => params.append('engines', e));

  try {
    const res = await fetch('/api/benchmark/run', { method: 'POST', body: params });
    if (res.status === 409) { showError('ベンチマーク実行中です。完了をお待ちください。'); setRunning(false); return; }
    if (!res.ok) { showError(await res.text()); setRunning(false); return; }
    // 202 Accepted — poll until done
    pollUntilDone();
  } catch(e) {
    showError(e.message);
    setRunning(false);
  }
}

function pollUntilDone() {
  const interval = setInterval(async () => {
    try {
      const st = await fetch('/api/benchmark/status').then(r => r.json());
      const phase = st.phase || '';
      if (phase && phase !== 'idle' && phase !== 'done') {
        document.getElementById('overlay-msg').textContent =
          'ベンチマーク実行中... [' + phase + ']';
      }
      if (!st.running) {
        clearInterval(interval);
        const results = await fetch('/api/benchmark/results').then(r => r.json());
        allResults = results;
        renderResults();
        document.getElementById('btn-csv').disabled = false;
        setRunning(false);
      }
    } catch(e) {
      clearInterval(interval);
      showError(e.message);
      setRunning(false);
    }
  }, 3000);
}

// ── Render ────────────────────────────────────────────────────────────────────
function renderResults() {
  if (!allResults.length) return;
  document.getElementById('results-section').style.display = 'block';
  renderChart();
  renderTable();
}

function renderChart() {
  const metric = METRICS.find(m => m.key === activeMetric);
  document.getElementById('chart-title').textContent = metric.title;

  const workloads    = WORKLOAD_ORDER.filter(w => allResults.some(r => r.workloadType === w));
  const usedEngines  = engines.filter(e => allResults.some(r => r.dbEngine === e.id));

  const datasets = usedEngines.map(e => ({
    label: e.displayName,
    backgroundColor: hexAlpha(e.color, 0.7),
    borderColor: e.color,
    borderWidth: 1,
    data: workloads.map(w => {
      const r = allResults.find(x => x.dbEngine === e.id && x.workloadType === w);
      if (!r || r.status !== 'success') return null;
      let v = r[activeMetric];
      if (activeMetric === 'storageSizeBytes') v = v < 0 ? null : v / (1024 * 1024);
      if (activeMetric === 'writeAmplificationFactor') v = v < 0 ? null : v;
      return v;
    })
  }));

  if (chart) chart.destroy();
  chart = new Chart(document.getElementById('mainChart'), {
    type: 'bar',
    data: { labels: workloads.map(w => WORKLOAD_LABEL[w] || w), datasets },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: {
        legend: { labels: { color: '#94a3b8', boxWidth: 12 } },
        tooltip: { callbacks: { label: ctx => ctx.dataset.label + ': ' + (ctx.raw == null ? 'N/A' : ctx.raw.toFixed(2)) + ' ' + metric.unit } }
      },
      scales: {
        x: { ticks: { color: '#64748b' }, grid: { color: '#1a2540' } },
        y: { ticks: { color: '#64748b' }, grid: { color: '#1e2d4a' },
             title: { display: true, text: metric.unit, color: '#4b5d73' } }
      }
    }
  });
}

function renderTable() {
  const tbody = document.getElementById('result-tbody');
  tbody.innerHTML = '';

  WORKLOAD_ORDER.forEach(wl => {
    const rows = allResults.filter(r => r.workloadType === wl);
    if (!rows.length) return;

    rows.forEach((r, i) => {
      const e    = engines.find(x => x.id === r.dbEngine) || { displayName: r.dbEngine, color: '#888' };
      const tr   = document.createElement('tr');

      const isOk  = r.status === 'success';
      const thr   = isOk ? fmt(r.throughputOpsPerSec) : '—';
      const avg   = isOk ? fmt(r.avgLatencyMs) : '—';
      const p95   = isOk ? fmt(r.p95LatencyMs) : '—';
      const p99   = isOk ? fmt(r.p99LatencyMs) : '—';
      const cpu   = isOk ? fmt(r.cpuUsagePercent) + '%' : '—';
      const waf   = isOk && r.writeAmplificationFactor >= 0 ? fmt(r.writeAmplificationFactor) + 'x' : '<span class="val-na">N/A</span>';
      const stor  = isOk && r.storageSizeBytes >= 0
                    ? fmt(r.storageSizeBytes / (1024*1024)) + ' MB'
                    : '<span class="val-na">N/A</span>';
      const stTxt = r.status === 'unavailable' ? `<span class="status-unavailable">接続不可</span>`
                  : r.status === 'error'        ? `<span class="status-error" title="${r.notes}">Error</span>`
                  : '<span class="val-good">✓</span>';

      tr.innerHTML = `
        <td><strong>${WORKLOAD_LABEL[wl] || wl}</strong></td>
        <td><span class="engine-dot" style="background:${e.color}"></span>${e.displayName}</td>
        <td>${thr}</td><td>${avg}</td><td>${p95}</td><td>${p99}</td>
        <td>${cpu}</td><td>${waf}</td><td>${stor}</td><td>${stTxt}</td>`;
      tbody.appendChild(tr);
    });
  });
}

// ── CSV download ──────────────────────────────────────────────────────────────
async function downloadCsv() {
  const res = await fetch('/api/benchmark/results/csv');
  if (!res.ok) { showError('CSVのダウンロードに失敗しました'); return; }
  const blob = await res.blob();
  const url  = URL.createObjectURL(blob);
  const a    = Object.assign(document.createElement('a'), { href: url, download: 'benchmark-results.csv' });
  a.click(); URL.revokeObjectURL(url);
}

// ── Helpers ───────────────────────────────────────────────────────────────────
function clearResults() {
  allResults = [];
  document.getElementById('results-section').style.display = 'none';
  document.getElementById('btn-csv').disabled = true;
  clearError();
  if (chart) { chart.destroy(); chart = null; }
}

function setRunning(on) {
  document.getElementById('btn-run').disabled = on;
  const pill = document.getElementById('status-pill');
  const text = document.getElementById('status-text');
  if (on) {
    pill.className = 'status-pill status-running'; pill.textContent = '実行中';
    text.textContent = 'ベンチマーク実行中です。大きなデータセットは数分かかる場合があります...';
    document.getElementById('overlay').classList.add('active');
    document.getElementById('overlay-msg').textContent = 'ベンチマーク実行中...';
  } else {
    pill.className = 'status-pill status-done'; pill.textContent = '完了';
    text.textContent = allResults.length ? allResults.length + ' 件の結果を取得しました' : '';
    document.getElementById('overlay').classList.remove('active');
  }
}

function showError(msg) {
  document.getElementById('error-area').innerHTML =
    '<div class="error-box">' + msg + '</div>';
}
function clearError() {
  document.getElementById('error-area').innerHTML = '';
}
function fmt(v) { return (typeof v === 'number') ? v.toFixed(2) : String(v); }
function hexAlpha(hex, alpha) {
  const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${alpha})`;
}

boot();
</script>
