spring:
  # Disable Spring Boot's auto-configured single datasource — we manage our own
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.jdbc.DataSourceTransactionManagerAutoConfiguration
  sql:
    init:
      mode: never

server:
  port: 8080

benchmark:
  mysql:
    url: ${BENCHMARK_MYSQL_URL:jdbc:mysql://localhost:3307/benchmark_db?useSSL=false&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true}
    username: ${BENCHMARK_MYSQL_USER:benchmark}
    password: ${BENCHMARK_MYSQL_PASS:benchmark}
  postgresql:
    url: ${BENCHMARK_PG_URL:jdbc:postgresql://localhost:5432/benchmark_db}
    username: ${BENCHMARK_PG_USER:benchmark}
    password: ${BENCHMARK_PG_PASS:benchmark}
  cockroachdb:
    url: ${BENCHMARK_CRDB_URL:jdbc:postgresql://localhost:26257/defaultdb?sslmode=disable}
    username: ${BENCHMARK_CRDB_USER:root}
    password: ${BENCHMARK_CRDB_PASS:}
  cassandra:
    hosts: ${BENCHMARK_CASSANDRA_HOSTS:localhost}
    port: ${BENCHMARK_CASSANDRA_PORT:9042}
    datacenter: ${BENCHMARK_CASSANDRA_DC:datacenter1}
  scylladb:
    hosts: ${BENCHMARK_SCYLLA_HOSTS:localhost}
    port: ${BENCHMARK_SCYLLA_PORT:9043}
    datacenter: ${BENCHMARK_SCYLLA_DC:datacenter1}
  rocksdb:
    path: ${BENCHMARK_ROCKSDB_PATH:./rocksdb-data}
  enabled-engines:
  mode: ${BENCHMARK_MODE:worker}
  row-count: ${BENCHMARK_ROW_COUNT:5000}
  read-iter: ${BENCHMARK_READ_ITER:1000}
  s3:
    bucket:     ${BENCHMARK_S3_BUCKET:}
    run-id:     ${BENCHMARK_S3_RUN_ID:}
    worker-key: ${BENCHMARK_S3_WORKER_KEY:}
  ecs:
    cluster:            ${BENCHMARK_ECS_CLUSTER:db-benchmark}
    subnets:            ${BENCHMARK_ECS_SUBNETS:}
    security-groups:    ${BENCHMARK_ECS_SECURITY_GROUPS:}
    execution-role-arn: ${BENCHMARK_ECS_EXECUTION_ROLE_ARN:arn:aws:iam::074213351472:role/ecsTaskExecutionRole}
    worker-task-role-arn: ${BENCHMARK_ECS_WORKER_TASK_ROLE_ARN:}
  defaults:
    connection-timeout-ms: 5000
    pool-size: 5

logging:
  level:
    com.example: INFO
    com.datastax: WARN
    org.rocksdb: WARN
